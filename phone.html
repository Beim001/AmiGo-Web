<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AmiGO 手机预览</title>
    <!--
      仅供开发时在 VS Code 内置浏览器等宽度不可控的窗口里按手机尺寸预览。
      iframe 拥有独立视口，Tailwind 断点与 fixed 弹层都会按手机宽度生效。
      vite build 只以 index.html 为入口，本文件不会进入产物。
    -->
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #111218;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      iframe {
        width: 390px;
        height: min(844px, calc(100dvh - 32px));
        border: 0;
        border-radius: 24px;
        box-shadow: 0 0 0 8px #000, 0 12px 40px rgba(0, 0, 0, 0.6);
        background: #fff;
      }
    </style>
  </head>
  <body>
    <iframe src="./" title="AmiGO"></iframe>
  </body>
</html>
